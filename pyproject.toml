[project]
name = "jax-in-lean"
version = "0.1.0"
description = "The JAX version modelled in Lean, for reading its source and running reproducers"
requires-python = ">=3.15"
dependencies = [
    # Exact pin: every Lean definition cites a line of this version's source.
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# On case-insensitive file systems (macOS), `Jax/` would make `jax` first-party.
known-third-party = ["jax"]

[tool.ty.environment]
# The scripts import each other; `bugs` would otherwise resolve to the `bugs/` records.
root = ["scripts"]
